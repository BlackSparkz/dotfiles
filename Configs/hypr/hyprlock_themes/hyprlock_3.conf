# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 6
    contrast = 1.4
    brightness = 0.8
    vibrancy = 0.6
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor =
    size = 220, 40
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.5 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.2)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = Enter Password
    hide_input = false
    position = 0, 90
    halign = center
    valign = bottom
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.9)
    font_size = 120
    font_family = SF Pro Display Bold
    position = 0, 280
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.9)
    font_size = 34
    font_family = SF Pro Display Bold
    position = 0, 400
    halign = center
    valign = center
}

# Profie-Photo
image {
    monitor =
    path = ~/.config/Resources/images/PFP.jpg
    border_color = 0xffdddddd
    border_size = 2
    size = 100
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 220
    halign = center
    valign = bottom
}

label {
    text = Hello, $USER
    color = rgba(250, 250, 250, 1.0)
    font_size = 24
    font_family = SF Pro Display Bold
    position = 0, -360
    halign = center
    valign = center
}
